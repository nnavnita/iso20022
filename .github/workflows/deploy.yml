name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check data integrity
        run: python3 tests/test_data.py

      - name: Rebuild the page
        run: python3 build.py

      # dist/index.html is committed because it is the deliverable — cloning
      # the repo should give you a working page. The cost of that choice is
      # that it can go stale, so fail loudly rather than publish a page that
      # no longer matches data/.
      - name: Fail if the committed build is stale
        run: |
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is out of date. Run 'python3 build.py' and commit the result."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      # Publish only dist/, so the page is served at /iso20022/ rather than
      # /iso20022/dist/index.html.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
